name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded push on the same ref is wasted CI time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      # TODO: drop continue-on-error once src/ is clean. As of writing `ruff check src`
      # reports 17 findings in modules still being written, and `ruff format --check`
      # would rewrite 45 files, so formatting is NOT enforced here on purpose -
      # enabling it would mean reformatting code other authors are actively editing.
      - name: ruff check
        run: ruff check src tests benchmarks scripts
        continue-on-error: true
      - name: ruff check (own test + benchmark code, blocking)
        run: ruff check tests/security benchmarks
      # TODO: drop continue-on-error once the 41 remaining mypy findings are fixed.
      - name: mypy
        run: mypy src
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - run: pip install -e .[dev]
      - name: pytest
        run: pytest -q --timeout=600

  security:
    # Kept as its own job so a security regression is a separate red check,
    # not a line buried in the full test output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e .[dev]
      - name: Security test suite
        run: pytest tests/security -q --timeout=600
      # pip-audit needs to reach the PyPI advisory database, so it is advisory only:
      # a network blip must not turn the security check red.
      - name: pip-audit (advisory)
        run: |
          pip install pip-audit
          pip-audit --strict --desc
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel into a clean venv and smoke it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/musiccontext --version
          # `doctor` reports on optional providers and may exit non-zero when none is
          # configured; that is a correct result in CI, so capture output and continue.
          /tmp/fresh/bin/musiccontext doctor --json || true
          /tmp/fresh/bin/musiccontext providers --json
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
